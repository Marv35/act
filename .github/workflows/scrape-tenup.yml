name: Scrape TenUp Effectif

on:
  schedule:
    - cron: '0 8 * * 1'  # Tous les lundis à 8h (UTC)
  workflow_dispatch:     # Permet de lancer manuellement depuis GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run scraping script
        run: node scripts/scrape-tenup-effectif.js

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/tenup-effectif.json
          git diff --cached --quiet || git commit -m "Mise à jour auto des effectifs TenUp"
          git push
